name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Same gates the README documents, so a broken build cannot reach an image.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
      - name: Chart regression
        run: node test_chart.js < static/app.js
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  # Single-image build on PRs: proves the Dockerfile still works without publishing.
  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 is emulated on amd64 runners, so publishing only happens off PRs.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Smoke-test the pushed image: bootstrap the admin key, then trade through HTTP.
  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Run the published image
        run: |
          set -eu
          image="$IMAGE:sha-${GITHUB_SHA::7}"
          docker run -d --name fx-smoke -p 8000:8000 \
            -e FX_ADMIN_PSK=smoke-test-psk "$image"
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/api/symbols > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/symbols | head -c 200

      - name: Admin login and registration
        run: |
          set -eu
          tok=$(curl -fsS -X POST http://127.0.0.1:8000/api/admin/login \
            -H 'Content-Type: application/json' \
            -d '{"psk":"smoke-test-psk"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          test -n "$tok"
          curl -fsS -X POST http://127.0.0.1:8000/api/auth \
            -H 'Content-Type: application/json' \
            -d '{"action":"register","name":"smoke","pwd":"smoke"}' | head -c 120

      - name: Logs and cleanup
        if: always()
        run: |
          docker logs fx-smoke || true
          docker rm -f fx-smoke || true
