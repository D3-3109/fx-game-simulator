name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same gates the README documents, so a broken build cannot reach an image.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
      - name: Chart regression
        run: node test_chart.js < static/app.js
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  # Pull requests only prove the Dockerfile still builds; nothing is published.
  pr-build:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  # One native runner per architecture: no QEMU emulation, the whole dependency
  # graph compiles at native speed. Each leg pushes a single-arch image by digest;
  # merge combines those digests into one multi-arch tag.
  build:
    needs: verify
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify both architectures are present
        run: |
          # The smoke job pulls the sha tag, so verify the manifest via that ref.
          docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" \
            --format '{{json .Manifest}}' \
            | jq -r '.manifests[] | .platform | "\(.os)/\(.architecture)"' | sort | tee /tmp/platforms
          grep -qx 'linux/amd64' /tmp/platforms
          grep -qx 'linux/arm64' /tmp/platforms

  # Smoke-test the published image: bootstrap the admin key, then register a user.
  smoke:
    needs: merge
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve image reference
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Run the published image
        run: |
          set -eu
          docker run -d --name fx-smoke -p 8000:8000 \
            -e FX_ADMIN_PSK=smoke-test-psk \
            "$IMAGE:sha-${GITHUB_SHA::7}"
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8000/api/symbols > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/symbols | head -c 200

      - name: Admin login and registration
        run: |
          set -eu
          tok=$(curl -fsS -X POST http://127.0.0.1:8000/api/admin/login \
            -H 'Content-Type: application/json' \
            -d '{"psk":"smoke-test-psk"}' \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          test -n "$tok"
          curl -fsS -X POST http://127.0.0.1:8000/api/auth \
            -H 'Content-Type: application/json' \
            -d '{"action":"register","name":"smoke","pwd":"smoke"}' | head -c 120

      - name: Confirm the container runs unprivileged and persisted the key
        run: |
          set -eu
          # `docker exec` defaults to the image USER (root here), so read the server
          # process's own uid from /proc: that is what dropped privileges.
          # The entrypoint `exec`s the server, so the server is PID 1 and inherits the
          # uid that setpriv set. Reading /proc/1/status avoids any process search.
          server_uid="$(docker exec fx-smoke awk '/^Uid:/{print $2}' /proc/1/status)"
          echo "server uid=$server_uid"
          test "$server_uid" = "10001"
          docker exec fx-smoke test -f /data/admin-key.json

      - name: Logs and cleanup
        if: always()
        run: |
          docker logs fx-smoke || true
          docker rm -f fx-smoke || true
